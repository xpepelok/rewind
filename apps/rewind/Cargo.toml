[package]
name = "rewind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "Rewind"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
rewind-capture.workspace = true
rewind-config.workspace = true
rewind-hotkey.workspace = true
rewind-media.workspace = true
rewind-nvbus.workspace = true
rewind-trace.workspace = true
image = { version = "0.25", default-features = false }
smallvec = "1"
youtube.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle.workspace = true
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
